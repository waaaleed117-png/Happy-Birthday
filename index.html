<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Vibe ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@800&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(45deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
        }

        /* Animated Background Particles */
        .bg-circle {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            z-index: 1;
            filter: blur(10px);
            animation: move 20s infinite linear;
        }

        /* Glassmorphism Timer Box */
        #timer-box {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 50px 80px;
            border-radius: 30px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.1);
            text-align: center;
            z-index: 10;
        }

        #timer-container {
            font-size: 12rem;
            color: #fff;
            text-shadow: 0 0 20px #ff1493, 0 0 40px #ff69b4;
            animation: zoomIn 1s ease-in-out infinite;
        }

        /* Birthday Section */
        #main-content {
            display: none;
            text-align: center;
            z-index: 10;
        }

        .hb-text {
            font-family: 'Dancing Script', cursive;
            font-size: 7rem;
            color: white;
            text-shadow: 2px 2px 15px #ff1493, 0 0 25px #ff69b4;
            animation: heartBeat 2s infinite;
        }

        /* Animations */
        @keyframes zoomIn {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.1); }
            70% { transform: scale(1); }
        }

        @keyframes move {
            from { transform: translate(0, 0); }
            to { transform: translate(100vw, 100vh); }
        }

        .heart {
            position: absolute;
            color: #ff1493;
            animation: floatUp 4s linear forwards;
            z-index: 5;
        }

        @keyframes floatUp {
            to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- Floating Background Elements -->
    <div class="bg-circle" style="width: 100px; height: 100px; top: 10%; left: 10%;"></div>
    <div class="bg-circle" style="width: 150px; height: 150px; bottom: 20%; right: 15%;"></div>

    <!-- Timer Box -->
    <div id="timer-box">
        <div id="timer-container">3</div>
    </div>

    <!-- Main Surprise -->
    <div id="main-content">
        <h1 class="hb-text">Happy Birthday! 🎀✨</h1>
    </div>

    <script>
        const timerElement = document.getElementById('timer-container');
        const timerBox = document.getElementById('timer-box');
        const mainContent = document.getElementById('main-content');
        let count = 3;

        const countdown = setInterval(() => {
            count--;
            if (count > 0) {
                timerElement.innerText = count;
            } else {
                clearInterval(countdown);
                timerBox.style.display = 'none';
                mainContent.style.display = 'block';
                createHearts();
            }
        }, 1000);

        function createHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.innerHTML = '💖';
                heart.classList.add('heart');
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = '100vh';
                heart.style.fontSize = Math.random() * 20 + 20 + 'px';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 4000);
            }, 150);
        }
    </script>
</body>
</html>
