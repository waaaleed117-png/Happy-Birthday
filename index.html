<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@800&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Countdown Background: Pinkish Aesthetic Gradient */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Animated Background Sparkles for Countdown */
        .sparkle {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite;
        }

        @keyframes twinkle {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.5); opacity: 1; }
        }

        /* Countdown Container */
        #timer-container {
            font-size: 12rem;
            color: #fff;
            text-shadow: 0 0 30px #ff1493, 0 0 60px #ff69b4;
            animation: bounceIn 1s ease-in-out infinite;
            z-index: 20;
        }

        /* Main Surprise Section */
        #main-content {
            display: none;
            width: 100%;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 30;
            background-color: #000; /* Taakay image ke side borders black rahain */
        }

        /* Background Image - Fixed to FIT the screen */
        .bg-image {
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/B2qSwnMB/hussain-image.jpg'); 
            /* 'contain' se image poori nazar aaye gi bina katay */
            background-size: contain; 
            background-position: center;
            background-repeat: no-repeat;
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
            transition: transform 2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .hb-container {
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Text ko thora neechay rakhnay ke liye */
            align-items: center;
            width: 100%;
            height: 100%;
            padding-bottom: 50px;
            box-sizing: border-box;
        }

        .hb-text {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: white;
            text-shadow: 0 0 20px #ff1493, 0 0 40px #000;
            background: rgba(0, 0, 0, 0.3); /* Image ke upar text saaf dikhay */
            padding: 10px 30px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            animation: fadeInScale 1.5s ease-out forwards;
        }

        /* Animations */
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: translateY(20px) scale(0.8); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .heart {
            position: absolute;
            color: #ff1493;
            text-shadow: 0 0 10px rgba(255, 20, 147, 0.8);
            pointer-events: none;
            animation: floatUp 4s linear forwards;
            z-index: 40;
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Countdown Page Sparkles -->
    <script>
        for (let i = 0; i < 30; i++) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = Math.random() * 100 + 'vw';
            sparkle.style.top = Math.random() * 100 + 'vh';
            const size = Math.random() * 5 + 2 + 'px';
            sparkle.style.width = size;
            sparkle.style.height = size;
            sparkle.style.setProperty('--duration', Math.random() * 3 + 2 + 's');
            document.body.appendChild(sparkle);
        }
    </script>

    <!-- 3-Second Timer -->
    <div id="timer-container">3</div>

    <!-- Main Surprise -->
    <div id="main-content">
        <div class="bg-image"></div>
        <div class="hb-container">
            <h1 class="hb-text">Happy Birthday! 🎀✨</h1>
        </div>
    </div>

    <script>
        const timerElement = document.getElementById('timer-container');
        const mainContent = document.getElementById('main-content');
        const bgImage = document.querySelector('.bg-image');
        let count = 3;

        const countdown = setInterval(() => {
            count--;
            if (count > 0) {
                timerElement.innerText = count;
            } else {
                clearInterval(countdown);
                revealSurprise();
            }
        }, 1000);

        function revealSurprise() {
            timerElement.style.display = 'none';
            // Background sparkles ko khtm krne k liye (optional)
            document.querySelectorAll('.sparkle').forEach(s => s.remove());
            
            mainContent.style.display = 'block';
            
            // Image reveal zoom effect
            bgImage.style.transform = 'scale(1.05)';
            
            createHearts();
        }

        function createHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.innerHTML = '💖';
                heart.classList.add('heart');
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = Math.random() * 20 + 20 + 'px';
                heart.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 4000);
            }, 250);
        }
    </script>
</body>
</html>
