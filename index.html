<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Birthday Surprise ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@800&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Mobile jumping fix */
            touch-action: none;
        }

        /* Canvas for the Square Dots Effect */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
            width: 100%;
            height: 100%;
        }

        #timer-container {
            position: relative;
            font-size: 10rem;
            color: #fff;
            text-shadow: 0 0 30px #ff1493, 0 0 60px #ff69b4;
            animation: bounceIn 1s ease-in-out infinite;
            z-index: 20;
        }

        #main-content {
            display: none;
            width: 100%;
            /* d極 height mobile address bar ka hal hai */
            height: 100dvh; 
            position: fixed;
            top: 0;
            left: 0;
            z-index: 30;
        }

        .bg-image {
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/B2qSwnMB/hussain-image.jpg'); 
            background-size: cover; 
            background-position: center center;
            background-repeat: no-repeat;
            filter: brightness(0.8);
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
            transform: scale(1.1);
            /* Mobile transition fix */
            transition: transform 1.5s ease-out;
        }

        .hb-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            text-align: center;
            background: rgba(0,0,0,0.2);
        }

        .hb-text {
            font-family: 'Dancing Script', cursive;
            font-size: 5rem;
            color: white;
            padding: 20px;
            text-shadow: 0 0 25px #ff1493, 0 0 50px #ff69b4;
            animation: fadeInScale 2s ease-out forwards;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        .heart {
            position: absolute;
            color: #ff1493;
            text-shadow: 0 0 10px rgba(255, 20, 147, 0.7);
            pointer-events: none;
            animation: floatUp 5s linear forwards;
            z-index: 35;
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        @media (max-width: 768px) {
            .hb-text { font-size: 3rem; width: 90%; }
            #timer-container { font-size: 7rem; }
            /* Mobile par fixed background stable nahi rehta */
            .bg-image { background-attachment: scroll; } 
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div id="timer-container">3</div>

    <div id="main-content">
        <div class="bg-image"></div>
        <div class="hb-container">
            <h1 class="hb-text">Happy Birthday! 🎀✨</h1>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function setCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        setCanvasSize();

        // Digital Square Dots Logic
        const dotSize = 4; 
        const spacing = 15; 
        let columns = Math.floor(canvas.width / spacing);
        let drops = [];

        function initDrops() {
            columns = Math.floor(canvas.width / spacing);
            for (let x = 0; x < columns; x++) {
                drops[x] = Math.random() * -100; 
            }
        }
        initDrops();

        function drawDots() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff1493"; 

            for (let i = 0; i < drops.length; i++) {
                ctx.fillRect(i * spacing, drops[i] * spacing, dotSize, dotSize);

                if (drops[i] * spacing > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        let matrixInterval = setInterval(drawDots, 30);

        const timerElement = document.getElementById('timer-container');
        const mainContent = document.getElementById('main-content');
        const bgImage = document.querySelector('.bg-image');
        let count = 3;

        function createHearts() {
            const heart = document.createElement('div');
            heart.innerHTML = '💖';
            heart.classList.add('heart');
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 20 + 20 + 'px';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }

        setInterval(createHearts, 300);

        const countdown = setInterval(() => {
            count--;
            if (count > 0) {
                timerElement.innerText = count;
            } else {
                clearInterval(countdown);
                revealSurprise();
            }
        }, 1000);

        function revealSurprise() {
            clearInterval(matrixInterval);
            canvas.style.display = 'none';
            timerElement.style.display = 'none';
            mainContent.style.display = 'block';
            setTimeout(() => {
                bgImage.style.transform = 'scale(1)';
            }, 50);
        }

        window.addEventListener('resize', () => {
            setCanvasSize();
            initDrops();
        });
    </script>
</body>
</html>
