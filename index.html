<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@800&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Montserrat', sans-serif;
        }

        /* Background Image Setup */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Aapki di gayi image */
            background-image: url('https://i.ibb.co/60gfNXCF/your-image.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(0.7); /* Taakay text saaf nazar aaye */
            z-index: -1;
            transition: transform 2s ease;
        }

        /* Full Screen Center Container */
        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* Countdown Style - Direct on BG */
        #timer-container {
            font-size: 10rem;
            color: #fff;
            text-shadow: 0 0 30px #ff1493, 0 0 60px #ff69b4;
            animation: bounceIn 1s ease-in-out infinite;
            z-index: 10;
        }

        /* Birthday Text - Chota size aur New Animation */
        #main-content {
            display: none;
            text-align: center;
            z-index: 10;
        }

        .hb-text {
            font-family: 'Dancing Script', cursive;
            font-size: 4.5rem; /* Size thora kam kar diya */
            color: white;
            text-shadow: 0 0 20px #ff1493;
            animation: fadeInScale 2.5s ease-out forwards;
        }

        /* Animations */
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 0; }
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Floating Hearts */
        .heart {
            position: absolute;
            color: #ff1493;
            text-shadow: 0 0 10px rgba(255, 20, 147, 0.5);
            pointer-events: none;
            animation: floatUp 5s linear forwards;
            z-index: 5;
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Mobile Optimization (just in case) */
        @media (max-width: 768px) {
            .hb-text { font-size: 3rem; }
            #timer-container { font-size: 7rem; }
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>

    <div class="container">
        <!-- 3-Second Timer -->
        <div id="timer-container">3</div>

        <!-- Main Surprise -->
        <div id="main-content">
            <h1 class="hb-text">Happy Birthday! 🎀✨</h1>
        </div>
    </div>

    <script>
        const timerElement = document.getElementById('timer-container');
        const mainContent = document.getElementById('main-content');
        const bgImage = document.querySelector('.bg-image');
        let count = 3;

        const countdown = setInterval(() => {
            count--;
            if (count > 0) {
                timerElement.innerText = count;
            } else {
                clearInterval(countdown);
                timerElement.style.display = 'none';
                mainContent.style.display = 'block';
                // Background zoom effect on reveal
                bgImage.style.transform = 'scale(1.1)';
                createHearts();
            }
        }, 1000);

        function createHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.innerHTML = '💖';
                heart.classList.add('heart');
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = Math.random() * 20 + 20 + 'px';
                heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 5000);
            }, 300);
        }
    </script>
</body>
</html>
