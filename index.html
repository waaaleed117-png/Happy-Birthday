<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@800&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Matrix effect ke liye background black rakha hai */
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Matrix Canvas - Jo dots nichay giray ga */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Countdown Container - Centered */
        #timer-container {
            position: relative;
            font-size: 10rem;
            color: #fff;
            text-shadow: 0 0 30px #ff1493, 0 0 60px #ff69b4;
            animation: bounceIn 1s ease-in-out infinite;
            z-index: 20;
        }

        /* Main Surprise Section */
        #main-content {
            display: none;
            width: 100%;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 30;
        }

        /* Background Image Setup - FULL LANDSCAPE */
        .bg-image {
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/B2qSwnMB/hussain-image.jpg'); 
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(0.8);
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
            transform: scale(1.1);
            transition: transform 2s ease;
        }

        /* Birthday Text */
        .hb-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            text-align: center;
            background: rgba(0,0,0,0.2); /* Image par text clear dikhne ke liye */
        }

        .hb-text {
            font-family: 'Dancing Script', cursive;
            font-size: 5rem;
            color: white;
            text-shadow: 0 0 25px #ff1493, 0 0 50px #ff69b4;
            animation: fadeInScale 2s ease-out forwards;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Floating Hearts */
        .heart {
            position: absolute;
            color: #ff1493;
            text-shadow: 0 0 10px rgba(255, 20, 147, 0.7);
            pointer-events: none;
            animation: floatUp 5s linear forwards;
            z-index: 35;
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        @media (max-width: 768px) {
            .hb-text { font-size: 3.5rem; }
            #timer-container { font-size: 7rem; }
        }
    </style>
</head>
<body>

    <!-- Matrix Rain Background -->
    <canvas id="matrix-canvas"></canvas>

    <div id="timer-container">3</div>

    <div id="main-content">
        <div class="bg-image"></div>
        <div class="hb-container">
            <h1 class="hb-text">Happy Birthday! 🎀✨</h1>
        </div>
    </div>

    <script>
        // --- MATRIX RAIN LOGIC ---
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Characters jo nichay girain gay (Square dots jaisa look dene ke liye)
        const charList = "010182739456%#*+-";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];

        for (let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ff1493"; // Pink color dots
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = charList.charAt(Math.floor(Math.random() * charList.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        let matrixInterval = setInterval(drawMatrix, 35);

        // --- EXISTING LOGIC ---
        const timerElement = document.getElementById('timer-container');
        const mainContent = document.getElementById('main-content');
        const bgImage = document.querySelector('.bg-image');
        let count = 3;

        function createHearts() {
            const heart = document.createElement('div');
            heart.innerHTML = '💖';
            heart.classList.add('heart');
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 20 + 20 + 'px';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }

        const heartInterval = setInterval(createHearts, 300);

        const countdown = setInterval(() => {
            count--;
            if (count > 0) {
                timerElement.innerText = count;
            } else {
                clearInterval(countdown);
                revealSurprise();
            }
        }, 1000);

        function revealSurprise() {
            // Stop matrix and hide it
            clearInterval(matrixInterval);
            canvas.style.display = 'none';
            
            timerElement.style.display = 'none';
            mainContent.style.display = 'block';
            setTimeout(() => {
                bgImage.style.transform = 'scale(1)';
            }, 10);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
