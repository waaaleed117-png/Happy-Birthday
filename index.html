<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Birthday Surprise ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@800&display=swap');

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Montserrat', sans-serif;
            position: fixed;
            touch-action: none;
        }

        #matrix-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
        }

        #timer-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem;
            color: #fff;
            text-shadow: 0 0 30px #ff1493, 0 0 60px #ff69b4;
            animation: bounceIn 1s ease-in-out infinite;
            z-index: 20;
        }

        #main-content {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.8);
            z-index: -1;
            pointer-events: none;
        }

        .hb-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            text-align: center;
            z-index: 15;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 5px; 
        }

        .simple-text {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem; /* Dono lines ka size same kar diya */
            color: white;
            margin: 0;
            font-weight: 700;
            text-shadow: 0 0 25px #ff1493, 0 0 50px #ff69b4;
            animation: fadeInScale 1.5s ease-out forwards;
            line-height: 1.1;
        }

        @keyframes bounceIn {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .heart {
            position: absolute;
            color: #ff1493;
            z-index: 100;
            pointer-events: none;
            animation: floatUp 5s linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh); opacity: 1; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }

        @media (max-width: 768px) {
            .simple-text { font-size: 2.8rem; }
            #timer-container { font-size: 6rem; }
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>
    <div id="timer-container">3</div>

    <div id="main-content">
        <img src="https://i.ibb.co/VY6NFDKk/IMG-20260513-WA0001.jpg" alt="Background" class="bg-image">
        <div class="hb-container">
            <div class="simple-text">Happy Birthday,</div>
            <div class="simple-text">Anoosha! 🎀✨</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        const mainContent = document.getElementById('main-content');

        function fixEverything() {
            const vh = window.innerHeight;
            const vw = window.innerWidth;
            document.body.style.height = vh + 'px';
            mainContent.style.height = vh + 'px';
            canvas.width = vw;
            canvas.height = vh;
        }

        window.addEventListener('resize', fixEverything);
        window.addEventListener('orientationchange', fixEverything);
        fixEverything();

        const dotSize = 4; 
        const spacing = 18; 
        let columns = Math.floor(canvas.width / spacing);
        let drops = Array(columns).fill(0).map(() => Math.random() * -50);

        function drawDots() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff1493"; 
            for (let i = 0; i < drops.length; i++) {
                ctx.fillRect(i * spacing, drops[i] * spacing, dotSize, dotSize);
                if (drops[i] * spacing > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        let matrixInterval = setInterval(drawDots, 35);

        const timerElement = document.getElementById('timer-container');
        let count = 3;

        function createHearts() {
            const heart = document.createElement('div');
            heart.innerHTML = '💖';
            heart.className = 'heart';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 15 + 20 + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
        setInterval(createHearts, 400);

        const countdown = setInterval(() => {
            count--;
            if (count > 0) {
                timerElement.innerText = count;
            } else {
                clearInterval(countdown);
                revealSurprise();
            }
        }, 1000);

        function revealSurprise() {
            clearInterval(matrixInterval);
            canvas.style.display = 'none';
            timerElement.style.display = 'none';
            mainContent.style.display = 'block';
            fixEverything();
        }
    </script>
</body>
</html>
